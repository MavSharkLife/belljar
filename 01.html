    <figure class="scene">
      <img src="assets/st-elizabeths-ward-beds-1925.jpg" alt="Archival photograph of rows of beds in a St. Elizabeths Hospital ward in 1925. The National Archives identifies the ward as housing African American patients.">
      <figcaption class="scene-bottomline"><span class="source-credit">NARA · ST. ELIZABETHS WARD · 1925</span></figcaption>
    </figure>
    <section class="reading">
      <blockquote>I guess I should have been excited the way most of the other girls were, but I couldn't get myself to react. I felt very still and very empty, the way the eye of a tornado must feel, moving dully along in the middle of the surrounding hullabaloo.</blockquote>
      <p class="attribution"><strong>Sylvia Plath</strong> · <em>The Bell Jar</em> · p. 8</p>
    </section>
